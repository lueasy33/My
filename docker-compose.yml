# Запуск в интернете: сайт + Caddy (сам получает и продлевает HTTPS-сертификат).
# Настройки — в файле .env рядом (образец: .env.example).
#   docker compose up -d --build

services:
  app:
    build: .
    restart: unless-stopped
    # Потолок памяти: если сайт «распухнет», перезапустится только он, а не повиснет весь сервер
    mem_limit: 512m
    environment:
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Администратор}
      # Адрес сайта — контакт отправителя push-уведомлений
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
